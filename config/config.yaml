framework:
    # Limits booking form submissions. Override the limits in the project's config.yaml if needed.
    rate_limiter:
        huh_rb_booking_client:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        huh_rb_booking_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
    assets:
        packages:
            huh_rb_build:
                json_manifest_path: '%kernel.project_dir%/vendor/heimrichhannot/contao-resource-booking-bundle/public/build/manifest.json'
                base_path: '/bundles/heimrichhannotresourcebooking/build'
            huh_rb:
                base_path: '/bundles/heimrichhannotresourcebooking'

contao:
    backend:
        custom_css:
            - 'bundles/heimrichhannotresourcebooking/backend/huh-rb.css'
